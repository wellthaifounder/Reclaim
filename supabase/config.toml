project_id = "fzmdfhdfvayaalhogskm"

[functions.process-receipt-ocr]
verify_jwt = true

# Welcome email on signup. Auth-gated: only mails the authenticated caller's
# own address, so it relies on the JWT being present.
[functions.send-welcome-email]
verify_jwt = true

# Reclaim Phase 3: user-authenticated wrapper around the Gemini-based
# Pub 502 classifier. Default verify_jwt is correct here — the function
# uses the caller's JWT to RLS-scope the invoice lookup.
[functions.classify-expense]
verify_jwt = true

# Removed 2026-08-26: create-tripwire-checkout, get-checkout-session,
# sync-provider-data and run-migration. All four had no caller left in the
# app and all four answered unauthenticated requests in production. The first
# two were pinned open by `verify_jwt = false` right here, which is how a
# stranger could mint Stripe checkout sessions and read back any session's
# metadata by id. Do not re-add an entry for a function that no longer exists.

[functions.wellbie-chat]
verify_jwt = true

[functions.plaid-create-link-token]
verify_jwt = true

[functions.plaid-exchange-token]
verify_jwt = true

[functions.plaid-sync-transactions]
verify_jwt = true

# Plaid posts to this endpoint server-to-server with no end-user JWT. The
# function performs its own ES256 webhook-signature verification using
# Plaid's published JWK (see _shared/plaidWebhookVerification.ts). Do not
# flip verify_jwt back to true — that would 401 all real Plaid webhooks.
[functions.plaid-webhook]
verify_jwt = false

# Resend posts inbound "email.received" events here server-to-server with no
# end-user JWT. The function verifies the Svix webhook signature and resolves
# the user from the secret token in the recipient address. Do not flip
# verify_jwt back to true — that would 401 all real inbound-email webhooks.
[functions.inbound-email-webhook]
verify_jwt = false

[functions.sync-npi-data]
verify_jwt = true

[functions.redact-phi]
verify_jwt = true
