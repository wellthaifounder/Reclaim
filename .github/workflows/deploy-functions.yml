# Deploy edge functions when they change on main.
#
# Why this exists: Vercel deploys the frontend automatically on every merge,
# but nothing deployed supabase/functions. So a merge shipped new frontend code
# against whatever backend someone last pushed by hand, and the mismatch was
# silent — the app would call a function running last month's logic and simply
# get the wrong answer. On 2026-08-26 production was six functions behind.
#
# The JWT flag is DERIVED, never typed. `--no-verify-jwt` turns off Supabase's
# gateway-level auth check, which is correct for a webhook (Plaid and Resend
# cannot send a Supabase token) and wrong for everything else. Deploying six
# functions by hand, one person got that flag wrong on five of them within a
# single minute. Here it comes from the SECURITY-EXEMPTION(user-jwt) marker in
# the function's own source — the same marker .claude/hooks/done-checks.mjs
# validates — so the deploy flag and the declared security model cannot drift
# apart, and neither can be changed without the other being reviewed.

name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Deploy every function, not just changed ones"
        type: boolean
        default: false

concurrency:
  # Never let two deploys race. Later commit wins; the earlier run is dropped
  # rather than cancelled mid-deploy, so a function is never half-updated.
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit to diff against.
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Work out which functions to deploy
        id: pick
        run: |
          set -euo pipefail
          all=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
                  ! -name '_*' -printf '%f\n' | sort)

          if [ "${{ github.event.inputs.deploy_all }}" = "true" ]; then
            echo "reason=manual deploy_all" >> "$GITHUB_OUTPUT"
            targets="$all"
          else
            before="${{ github.event.before }}"
            # All-zeros means a new branch or a force-push with no usable base.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              echo "reason=no usable base commit" >> "$GITHUB_OUTPUT"
              targets="$all"
            else
              changed=$(git diff --name-only "$before" "${{ github.sha }}" -- supabase/functions/ || true)
              # A change under _shared/ can alter the behaviour of every function
              # that imports it, and the import graph is not worth parsing in
              # bash. Redeploy everything — it costs a few minutes and the
              # alternative is shipping a stale copy of shared logic.
              if echo "$changed" | grep -q '^supabase/functions/_'; then
                echo "reason=shared code changed" >> "$GITHUB_OUTPUT"
                targets="$all"
              else
                echo "reason=changed functions only" >> "$GITHUB_OUTPUT"
                targets=$(echo "$changed" \
                  | sed -n 's#^supabase/functions/\([^/]*\)/.*#\1#p' \
                  | sort -u)
              fi
            fi
          fi

          {
            echo "targets<<EOF"
            echo "$targets" | sed '/^$/d'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Will deploy:"; echo "$targets" | sed '/^$/d' | sed 's/^/  - /'

      - name: Deploy
        if: steps.pick.outputs.targets != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${PROJECT_ID:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID must be set as repository secrets."
            exit 1
          fi

          failed=""
          while read -r fn; do
            [ -n "$fn" ] || continue
            src="supabase/functions/$fn/index.ts"
            if [ ! -f "$src" ]; then
              echo "skip $fn (deleted or has no index.ts)"
              continue
            fi

            # THE flag, derived from the function's own declared security model.
            if grep -q 'SECURITY-EXEMPTION(user-jwt)' "$src"; then
              control=$(grep -o 'SECURITY-EXEMPTION(user-jwt)[[:space:]]*:[[:space:]]*[A-Za-z0-9_.-]*' "$src" \
                        | head -1 | sed 's/.*:[[:space:]]*//')
              # The marker must point at something real, exactly as the Stop
              # hook requires. A comment on its own must never open the gateway.
              if ! grep -v 'SECURITY-EXEMPTION' "$src" | grep -q "${control}("; then
                echo "::error::$fn declares SECURITY-EXEMPTION(user-jwt): $control but never calls it. Refusing to deploy with the gateway check disabled."
                failed="$failed $fn"
                continue
              fi
              echo "::notice::$fn — gateway JWT check OFF, authenticity via ${control}()"
              args="--no-verify-jwt"
            else
              args=""
            fi

            echo "── deploying $fn ${args:+($args)}"
            if ! supabase functions deploy "$fn" --project-ref "$PROJECT_ID" $args; then
              failed="$failed $fn"
            fi
          done <<< "${{ steps.pick.outputs.targets }}"

          if [ -n "$failed" ]; then
            echo "::error::Failed to deploy:$failed"
            exit 1
          fi
          echo "All functions deployed."

      - name: Confirm authentication is actually enforced
        if: steps.pick.outputs.targets != ''
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -uo pipefail
          # A deploy that "succeeded" while leaving an endpoint open is the
          # failure mode worth catching, so every function that did NOT declare
          # an exemption is probed unauthenticated and must refuse.
          bad=""
          while read -r fn; do
            [ -n "$fn" ] || continue
            src="supabase/functions/$fn/index.ts"
            [ -f "$src" ] || continue
            grep -q 'SECURITY-EXEMPTION(user-jwt)' "$src" && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                   -X POST "https://${PROJECT_ID}.functions.supabase.co/${fn}" \
                   -H 'Content-Type: application/json' -d '{}')
            if [ "$code" = "401" ]; then
              echo "  ok   $fn -> 401"
            else
              echo "  FAIL $fn -> $code (expected 401 without a token)"
              bad="$bad $fn"
            fi
          done <<< "${{ steps.pick.outputs.targets }}"

          if [ -n "$bad" ]; then
            echo "::error::Reachable without authentication:$bad"
            exit 1
          fi

      - name: Report functions live in production with no source here
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -uo pipefail
          # Deploying never deletes. A function removed from this repo keeps
          # running in production forever, serving code nobody can read here.
          # On 2026-08-26 that was four dead endpoints answering anonymous
          # requests -- one of them a service-role SQL runner with wildcard
          # CORS -- plus two whose source had been deleted months earlier.
          #
          # Reported, never acted on: a bad diff must not be able to delete
          # production infrastructure unattended. Removal stays a human running
          # `supabase functions delete <name> --project-ref <id>`.
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${PROJECT_ID:-}" ] || exit 0
          live=$(supabase functions list --project-ref "$PROJECT_ID" 2>/dev/null \
                 | awk -F'|' 'NF>3 {gsub(/ /,"",$3); if ($3 ~ /^[a-z0-9][a-z0-9-]*$/) print $3}' \
                 | sort)
          [ -n "$live" ] || { echo "Could not list deployed functions; skipping."; exit 0; }
          here=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
                   ! -name '_*' -printf '%f\n' | sort)
          orphans=$(comm -23 <(echo "$live") <(echo "$here"))
          if [ -n "$orphans" ]; then
            echo "::warning::Deployed with no source in this repo — review and delete if dead:"
            echo "$orphans" | sed 's/^/  /'
          else
            echo "Every deployed function has source in this repo."
          fi
