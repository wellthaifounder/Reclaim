<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-label="Reclaim wordmark lockup">
  <!-- Horizontal lockup: icon (Concept D stroke shown here as a placeholder mark) +
       "Reclaim" wordmark + ".health" tag. Swap the <g id="mark"> contents with the
       winning concept once chosen. Type is system sans here as a stand-in — set the
       real wordmark in Figma/Illustrator with the chosen brand typeface. -->
  <title>Reclaim — wordmark lockup</title>

  <!-- palette: teal=#0e9b94  gold=#e0b03f  navy=#1a2238 -->
  <defs>
    <linearGradient id="recover" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0e9b94" />
      <stop offset="1" stop-color="#e0b03f" />
    </linearGradient>
  </defs>

  <g id="mark" transform="translate(20 30) scale(0.47)">
    <path d="M56 120 L112 184 L208 64"
          fill="none" stroke="url(#recover)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="150" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#1a2238">Reclaim</text>
  <text x="505" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="300" fill="#0e9b94">.health</text>
</svg>
