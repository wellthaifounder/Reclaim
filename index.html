    <!-- Content Security Policy.
         Delivered as a <meta> tag because it is the only one of these that a
         meta tag can actually enforce. The others -- X-Frame-Options,
         X-Content-Type-Options, Referrer-Policy, Permissions-Policy -- were
         also duplicated here and every one of them is IGNORED when delivered
         this way; browsers only honour them as real response headers. They
         are set as headers in vercel.json, which is what is actually
         protecting the site (verified against the live response). The copies
         here did nothing but log two errors to every visitor's console on
         every page load.

         `frame-ancestors` is removed for the same reason -- a meta CSP cannot
         express it. Framing is denied by the X-Frame-Options header instead. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://cdn.plaid.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://*.supabase.co https://sandbox.plaid.com https://production.plaid.com https://api.stripe.com; frame-src 'self' http://localhost:* http://127.0.0.1:* https://js.stripe.com https://cdn.plaid.com https://*.supabase.co; base-uri 'self'; form-action 'self';"
    />

    <!--
      Theme, applied before first paint.

      React cannot do this: by the time it mounts, the browser has already
      painted a white page, and a dark-mode user sees a flash of white before
      it corrects itself. This reads the same localStorage key as
      ThemeContext and sets the class up front. Kept deliberately tiny and
      dependency-free -- it runs on every page load, including the offline
      shell. Wrapped in try/catch because localStorage throws in private
      browsing on some platforms, and a theme is not worth a blank page.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("reclaim-theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* fall through to light */
        }
      })();
    </script>
